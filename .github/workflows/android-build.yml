name: Build Project Sierra Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-android-apk:
    name: Build Android Debug APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22 (Current LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Pre-build Diagnostics
        run: |
          echo "=== Initial Directory Listing ==="
          ls -la
          echo "=== Android Directory Check ==="
          if [ -d android ]; then
            echo "STATUS: android/ directory exists in repository."
            ls -la android
          else
            echo "STATUS: android/ directory does NOT exist. Self-healing generation will create it."
          fi
          echo "=== Capacitor Version Check ==="
          npx cap --version || echo "Capacitor CLI not installed yet"

      - name: Install Node and Capacitor Dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci || npm install
          else
            npm install
          fi

      - name: Build Web Production Assets
        run: npm run build

      - name: Ensure Android Platform Exists (Self-Healing)
        run: |
          if [ ! -d android ]; then
            echo "android/ directory not found. Adding Android platform via Capacitor..."
            npx cap add android
          else
            echo "android/ directory is present."
          fi

      - name: Sync Web Assets and Plugins to Android Project
        run: npx cap sync android

      - name: Apply Required AndroidManifest Permissions and Queries
        run: node scripts/patch-manifest.cjs

      - name: Setup Debug Keystore
        run: |
          mkdir -p android/app
          if [ -f android/app/debug.keystore.base64 ]; then
            base64 -d android/app/debug.keystore.base64 > android/app/debug.keystore
          elif [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > android/app/debug.keystore
          elif [ -f debug.keystore ]; then
            cp debug.keystore android/app/debug.keystore
          fi

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;35.0.0 platform-tools'

      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      - name: Build Environment Diagnostics
        working-directory: android
        run: |
          echo "=== Java Version ==="
          java -version
          echo "=== JAVA_HOME ==="
          echo "$JAVA_HOME"
          echo "=== Gradle Version ==="
          ./gradlew --version
          echo "=== Android SDK Root ==="
          echo "$ANDROID_HOME"
          echo "=== Installed Android Platforms ==="
          ls -la "$ANDROID_HOME/platforms" || true
          echo "=== Installed Android Build Tools ==="
          ls -la "$ANDROID_HOME/build-tools" || true

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --max-workers=2 --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sierra-omniagent-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
